[project]
name = "esupplier-agent"
version = "0.1.0"
description = "e-supplier.lv produktu asistents (CLI)"
readme = "README.md"
authors = [
    { name = "Edvards Torsters-Makauskis", email = "info@tormaks.com" }
]
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.152",
    "httpx>=0.28.1",
    "markdown-it-py>=3.0.0",
    "mcp>=2.1.1",
    "openai>=2.53.0",
    "pillow>=12.3.0",
    "pypdf>=6.17.0",
    "pypdfium2>=5.13.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "xlrd>=2.0.2",
]

[project.scripts]
sync = "esupplier.catalog.sync:main"
chat = "esupplier.cli:main"
mail = "esupplier.mail.run:main"
mcp-katalogs = "esupplier.mcp_server:main"
skill = "esupplier.claude_code:main"
evals = "esupplier.evals.run:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "esupplier"
module-root = "src"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
